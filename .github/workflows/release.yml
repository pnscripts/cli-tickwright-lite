name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: make test dist VERSION=${GITHUB_REF_NAME#v}
      - run: gh release create "$GITHUB_REF_NAME" dist/* --title "Tickwright Lite ${GITHUB_REF_NAME#v}" --notes-file CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}

  docker:
    # Runs only after the owner adds the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret.
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ github.ref_name }}
          tags: |
            pnscripts/tickwright-lite:latest
            pnscripts/tickwright-lite:${{ github.ref_name }}
